    <rect x="48" y="308" width="352" height="150" rx="14" fill="#171f33" stroke="#22304a" stroke-width="1"/>
    <rect x="48" y="308" width="352" height="3" rx="1.5" fill="#c0c1ff"/>
    <text x="72" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#c0c1ff">04</text>
    <text x="72" y="376" font-size="24" font-weight="600" fill="#dae2fd">Scene code</text>
    <text x="72" y="406" font-size="18" fill="#8892b0">сцена + скилы &#8594; TSX</text>
    <text x="376" y="406" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5a6488">TSX</text>
    <rect x="72" y="420" width="304" height="30" rx="8" fill="#c0c1ff" fill-opacity="0.12"/>
    <text x="88" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c0c1ff">Motion &#183; LLM + Skills</text>

    <!-- 05 -->
    <rect x="424" y="308" width="352" height="150" rx="14" fill="#171f33" stroke="#22304a" stroke-width="1"/>
    <rect x="424" y="308" width="352" height="3" rx="1.5" fill="#c0c1ff"/>
    <text x="448" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#c0c1ff">05</text>
    <text x="448" y="376" font-size="24" font-weight="600" fill="#dae2fd">Render</text>
    <text x="448" y="406" font-size="18" fill="#8892b0">TSX &#8594; видео сцены</text>
    <text x="752" y="406" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5a6488">MP4</text>
    <rect x="448" y="420" width="304" height="30" rx="8" fill="#c0c1ff" fill-opacity="0.12"/>
    <text x="464" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c0c1ff">Motion &#183; Remotion (Node)</text>

    <!-- 06 -->
    <rect x="800" y="308" width="352" height="150" rx="14" fill="#171f33" stroke="#22304a" stroke-width="1"/>
    <rect x="800" y="308" width="352" height="3" rx="1.5" fill="#ffb4ab"/>
    <text x="824" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ffb4ab">06</text>
    <text x="824" y="376" font-size="24" font-weight="600" fill="#dae2fd">Final cut</text>
    <text x="824" y="406" font-size="18" fill="#8892b0">склейка + мастеринг</text>
    <text x="1128" y="406" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5a6488">final MP4</text>
    <rect x="824" y="420" width="304" height="30" rx="8" fill="#ffb4ab" fill-opacity="0.12"/>
    <text x="840" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#ffb4ab">Production &#183; FFmpeg</text>
