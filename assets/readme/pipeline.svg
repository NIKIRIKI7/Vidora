  <!-- arrows row 2 -->
  <g stroke="#4a5878" stroke-width="1.4" stroke-dasharray="3,3">
    <line x1="400" y1="383" x2="418" y2="383"/>
    <line x1="776" y1="383" x2="794" y2="383"/>
  </g>
  <polygon points="424,383 416,379 416,387" fill="#4a5878"/>
  <polygon points="800,383 792,379 792,387" fill="#4a5878"/>

  <!-- footer -->
  <text x="48" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#5a6488">progress &#8594; WebSocket (AUDIO_GEN_PROGRESS / RENDER_PROGRESS) &#183; артефакты и метаданные &#8594; SQLite + data_storage/</text>
