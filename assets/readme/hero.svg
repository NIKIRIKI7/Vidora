<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="title desc">
  <title id="title">Vidora — Markdown-сценарий в готовое MP4</title>
  <desc id="desc">Vidora — локальный видео-пайплайн: SCENARIO.md проходит через синтез речи OmniVoice, пословную синхронизацию FasterWhisper.NET, генерацию анимации Remotion и мастеринг FFmpeg, превращаясь в готовый MP4.</desc>

  <defs>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ddb7ff"/>
      <stop offset="50%" stop-color="#c0c1ff"/>
      <stop offset="100%" stop-color="#4fdbc8"/>
    </linearGradient>
    <linearGradient id="card-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddb7ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4fdbc8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="24" fill="#0b1326"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent-bar)"/>

  <!-- ===== Title block ===== -->
  <g transform="translate(56, 52)">
    <rect x="0" y="0" width="252" height="28" rx="14" fill="#ddb7ff" fill-opacity="0.12"/>
    <text x="126" y="18" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="600" letter-spacing="1" fill="#ddb7ff">LOCAL-FIRST VIDEO STUDIO</text>

    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="70" font-weight="700" letter-spacing="-2" fill="#dae2fd">Vidora</text>

    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="24" fill="#8892b0">Markdown-сценарий &#8594; готовое MP4</text>

    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="17" fill="#5a6488">Озвучка &#183; пословная синхронизация &#183; анимация &#183; мастеринг</text>

    <g transform="translate(0, 210)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <rect x="0" y="0" width="76" height="28" rx="8" fill="#171f33"/>
      <text x="38" y="18" text-anchor="middle" fill="#dae2fd">.NET 10</text>
      <rect x="84" y="0" width="130" height="28" rx="8" fill="#171f33"/>
      <text x="149" y="18" text-anchor="middle" fill="#dae2fd">Python + Torch</text>
      <rect x="222" y="0" width="90" height="28" rx="8" fill="#171f33"/>
      <text x="267" y="18" text-anchor="middle" fill="#dae2fd">React 19</text>
      <rect x="320" y="0" width="80" height="28" rx="8" fill="#171f33"/>
      <text x="360" y="18" text-anchor="middle" fill="#dae2fd">FFmpeg</text>
    </g>

    <g transform="translate(0, 246)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <rect x="0" y="0" width="94" height="28" rx="8" fill="#171f33"/>
      <text x="47" y="18" text-anchor="middle" fill="#dae2fd">Remotion</text>
      <rect x="102" y="0" width="152" height="28" rx="8" fill="#171f33"/>
      <text x="178" y="18" text-anchor="middle" fill="#dae2fd">FasterWhisper.NET</text>
      <rect x="262" y="0" width="138" height="28" rx="8" fill="#171f33"/>
      <text x="331" y="18" text-anchor="middle" fill="#dae2fd">Electron</text>
    </g>
  </g>

  <!-- ===== Pipeline card ===== -->
  <g transform="translate(636, 40)">
    <rect x="0" y="0" width="512" height="380" rx="16" fill="url(#card-sheen)" stroke="#22304a" stroke-width="1"/>
    <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" font-weight="600" letter-spacing="2" fill="#5a6488">PIPELINE</text>

    <!-- source -->
    <rect x="24" y="42" width="464" height="46" rx="10" fill="#0b1326" stroke="#2d3449" stroke-width="1"/>
    <g transform="translate(40, 52)" stroke="#ddb7ff" stroke-opacity="0.6" stroke-width="1.4" fill="none">
      <rect x="0" y="0" width="22" height="26" rx="3"/>
      <line x1="5" y1="8" x2="17" y2="8"/>
      <line x1="5" y1="13" x2="17" y2="13"/>
      <line x1="5" y1="18" x2="13" y2="18"/>
    </g>
    <text x="76" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#dae2fd">SCENARIO.md</text>
    <text x="472" y="70" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#5a6488">frontmatter + scenes</text>

    <!-- stages -->
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <!-- row 1 -->
      <rect x="24" y="100" width="464" height="46" rx="10" fill="#1c2438" stroke="#26324a" stroke-width="1"/>
      <circle cx="48" cy="123" r="13" fill="#ddb7ff" fill-opacity="0.16"/>
      <text x="48" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#ddb7ff">01</text>
      <text x="72" y="119" font-size="16" font-weight="600" fill="#dae2fd">Voice synthesis</text>
      <text x="72" y="136" font-size="12" fill="#8892b0">текст &#8594; WAV</text>
      <text x="472" y="128" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#ddb7ff">OmniVoice &#183; :8000</text>

      <!-- row 2 -->
      <rect x="24" y="154" width="464" height="46" rx="10" fill="#1c2438" stroke="#26324a" stroke-width="1"/>
      <circle cx="48" cy="177" r="13" fill="#4fdbc8" fill-opacity="0.16"/>
      <text x="48" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#4fdbc8">02</text>
      <text x="72" y="173" font-size="16" font-weight="600" fill="#dae2fd">Forced alignment</text>
      <text x="72" y="190" font-size="12" fill="#8892b0">слова &#8594; таймкоды</text>
      <text x="472" y="182" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4fdbc8">FasterWhisper.NET</text>

      <!-- row 3 -->
      <rect x="24" y="208" width="464" height="46" rx="10" fill="#1c2438" stroke="#26324a" stroke-width="1"/>
      <circle cx="48" cy="231" r="13" fill="#c0c1ff" fill-opacity="0.16"/>
      <text x="48" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#c0c1ff">03</text>
      <text x="72" y="227" font-size="16" font-weight="600" fill="#dae2fd">Scene motion</text>
      <text x="72" y="244" font-size="12" fill="#8892b0">сцена &#8594; Remotion TSX</text>
      <text x="472" y="236" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c0c1ff">Remotion + LLM</text>

      <!-- row 4 -->
      <rect x="24" y="262" width="464" height="46" rx="10" fill="#1c2438" stroke="#26324a" stroke-width="1"/>
      <circle cx="48" cy="285" r="13" fill="#ffb4ab" fill-opacity="0.16"/>
      <text x="48" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#ffb4ab">04</text>
      <text x="72" y="281" font-size="16" font-weight="600" fill="#dae2fd">Master &amp; mux</text>
      <text x="72" y="298" font-size="12" fill="#8892b0">LUFS &#183; склейка сцен</text>
      <text x="472" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#ffb4ab">FFmpeg</text>
    </g>

    <!-- stage connectors -->
    <g stroke="#3a4763" stroke-width="1.2" stroke-dasharray="2,2">
      <line x1="48" y1="146" x2="48" y2="154"/>
      <line x1="48" y1="200" x2="48" y2="208"/>
      <line x1="48" y1="254" x2="48" y2="262"/>
    </g>

    <!-- output -->
    <rect x="24" y="320" width="464" height="44" rx="10" fill="#0b1326" stroke="#ffb4ab" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="48" cy="342" r="11" fill="#ffb4ab" fill-opacity="0.18"/>
    <polygon points="45,337 45,347 53,342" fill="#ffb4ab"/>
    <text x="70" y="347" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#dae2fd">output.mp4</text>
    <text x="472" y="347" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#5a6488">1080p &#183; 60 fps &#183; H.264</text>
  </g>

  <text x="1140" y="444" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#2a354f">v0.1.0</text>
</svg>
